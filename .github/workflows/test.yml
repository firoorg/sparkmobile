name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends autoconf automake build-essential libboost-test-dev libssl-dev libtool pkg-config
      - name: Build
        run: ./build test-bin
      - name: Test
        run: ./run_all_tests test-bin
